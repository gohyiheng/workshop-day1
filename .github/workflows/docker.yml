name: Build and push image

on:
  push:
    branches: [main]
    # bundle is a gitlink (exact released commit), not a directory file glob.
    paths: [bundle, .github/workflows/docker.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Verify source dependencies
        working-directory: frontend
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
      - name: Verify pinned bundle inputs
        run: |
          git submodule status
          cmp backend/server.js bundle/server.js
          cmp cli/cli.js bundle/cli.js
          cd frontend
          npx ng build
          diff -r dist/snip-frontend/browser ../bundle/public
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ./bundle
          file: ./bundle/Dockerfile
          load: true
          push: false
          tags: snip:verified
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: snip:verified
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Smoke-test container
        run: |
          docker run -d --name snip-smoke -p 127.0.0.1:3100:3000 snip:verified
          SMOKE_ORIGIN=http://127.0.0.1:3100 node scripts/smoke-test.mjs
      - name: Container logs and cleanup
        if: always()
        run: |
          if docker container inspect snip-smoke >/dev/null 2>&1; then
            docker logs snip-smoke
            docker rm -f snip-smoke
          fi
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker tag snip:verified "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
