name: Build bundle

on:
  # Source branches do not contain this main-only workflow; do not use push.
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bundle-release
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1"
      - name: Configure bot identity
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Assemble release
        run: node scripts/build-bundle.mjs
      - name: Smoke-test release
        run: node scripts/smoke-test.mjs
      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Publish generated release
        run: node scripts/build-bundle.mjs --push
      # GITHUB_TOKEN pushes do not trigger another workflow. Dispatch Docker
      # explicitly after the verified main/bundle pointer has been published.
      - name: Start image verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docker.yml --ref main
